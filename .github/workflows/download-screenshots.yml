name: Download Game Screenshots (One-time)

on:
  workflow_dispatch: # Ручной запуск через GitHub UI

jobs:
  download-screenshots:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install puppeteer node-fetch@2 fs-extra

      - name: Download screenshots
        run: node scripts/download-screenshots.js

      - name: Commit and push screenshots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -d "images/games" ] && [ "$(ls -A images/games)" ]; then
            git add images/games/
            git commit -m "Add game screenshots from Yandex Games"
            git push
          fi
